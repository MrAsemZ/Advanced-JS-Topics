<!DOCTYPE html>
<html>

<head>
    <title>Registration Form</title>
</head>

<body>

    <h1>Registration Form</h1>


    <!-- ========================================
         STEP 1 — Personal Information
         ======================================== -->

    <div id="step1">

        <h2>Step 1: Personal Information</h2>

        <label>Name:</label>
        <input
            type="text"
            id="name"
        >

        <br><br>

        <label>Email:</label>
        <input
            type="email"
            id="email"
        >

        <br><br>

        <button id="next1">
            Next
        </button>

    </div>


    <!-- ========================================
         STEP 2 — Educational Information
         ======================================== -->

    <div id="step2">

        <h2>Step 2: Educational Information</h2>

        <label>University:</label>
        <input
            type="text"
            id="university"
        >

        <br><br>

        <label>Major:</label>
        <input
            type="text"
            id="major"
        >

        <br><br>

        <button id="back2">
            Back
        </button>

        <button id="next2">
            Next
        </button>

    </div>


    <!-- ========================================
         STEP 3 — Review and Confirm
         ======================================== -->

    <div id="step3">

        <h2>Step 3: Review and Confirm</h2>

        <div id="review"></div>

        <br>

        <button id="back3">
            Back
        </button>

        <button id="confirm">
            Confirm
        </button>

    </div>


    <script src="script.js"></script>

</body>

</html>
