<!DOCTYPE html>
<html>

<head>
    <title>Preferences Manager</title>
</head>

<body>

    <h1>User Preferences</h1>


    <!-- Theme -->

    <h2>Theme</h2>

    <button id="lightBtn">
        Light
    </button>

    <button id="darkBtn">
        Dark
    </button>


    <!-- Language -->

    <h2>Language</h2>

    <button id="englishBtn">
        English
    </button>

    <button id="arabicBtn">
        Arabic
    </button>


    <!-- Saved preferences -->

    <h2>Saved Preferences</h2>

    <div id="preferences"></div>


    <!-- Delete preferences -->

    <br>

    <button id="deleteBtn">
        Delete Preferences
    </button>


    <script src="script.js"></script>

</body>

</html>
