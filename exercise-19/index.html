<!DOCTYPE html>
<html>

<head>
    <title>Cookies & Preferences Manager</title>
</head>

<body>

    <h1>User Preferences</h1>


    <!-- ========================================
         Theme Preference
         ======================================== -->

    <h2>Theme</h2>

    <button id="lightBtn">
        Light
    </button>

    <button id="darkBtn">
        Dark
    </button>


    <!-- ========================================
         Language Preference
         ======================================== -->

    <h2>Language</h2>

    <button id="englishBtn">
        English
    </button>

    <button id="arabicBtn">
        Arabic
    </button>


    <!-- ========================================
         Saved Preferences
         ======================================== -->

    <h2>Saved Preferences</h2>

    <div id="preferences"></div>


    <!-- ========================================
         Delete Preferences
         ======================================== -->

    <button id="deleteBtn">
        Delete Preferences
    </button>


    <script src="script.js"></script>

</body>

</html>
